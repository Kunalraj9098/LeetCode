name: Sync Leetcode

on:
  workflow_dispatch:      # Allows you to trigger the sync manually anytime
  schedule:
    - cron: '0 8 * * *'   # Runs automatically every day at 8:00 AM UTC

jobs:
  build:
    runs-on: ubuntu-latest

    # This suppresses the Node 20 runtime wrapper enforcement alerts
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Run LeetCode Sync
        uses: joshcai/leetcode-sync@v1.7     # Upgraded version supports verbose and commit-header
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: 'solutions'                   
          verbose: true
          commit-header: '[LeetCode Sync]'
